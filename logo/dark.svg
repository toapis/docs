<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" width="180" height="48">
  <defs>
    <!-- Icon gradients -->
    <linearGradient id="toapisIconGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4fd8" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="toapisIconHighlight" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="toapisWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Icon: circle + lightning -->
  <circle cx="24" cy="24" r="20" fill="url(#toapisIconGrad)" />
  <circle cx="24" cy="24" r="20" fill="url(#toapisIconHighlight)" />
  <path
    d="M18 5.5 L9.5 19 H15.2 L13.2 26.5 L22.5 13.2 H16.8 L18.8 5.5 Z"
    transform="translate(8 8)"
    fill="#ffffff"
    fill-rule="evenodd"
    clip-rule="evenodd"
  />

  <!-- Text: ToAPIs (gradient) -->
  <text
    x="56"
    y="33"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="24"
    font-weight="700"
    fill="url(#toapisWordGrad)"
  >
    ToAPIs
  </text>
</svg>
