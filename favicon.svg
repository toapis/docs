<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="toapisIconGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4fd8" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="toapisIconHighlight" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 圆形渐变底 -->
  <circle cx="16" cy="16" r="15" fill="url(#toapisIconGrad)" />
  <circle cx="16" cy="16" r="15" fill="url(#toapisIconHighlight)" />

  <!-- 闪电图形（小尺寸更清晰，避免细线描边） -->
  <path
    d="M18 5.5 L9.5 19 H15.2 L13.2 26.5 L22.5 13.2 H16.8 L18.8 5.5 Z"
    fill="#ffffff"
